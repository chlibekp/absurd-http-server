worker_processes 3;
worker_cpu_affinity 001 010 100;
daemon off;
error_log /dev/null crit;
pid /tmp/nginx.pid;
events { worker_connections 65535; use epoll; multi_accept on; }
http {
  access_log off;
  sendfile on;
  tcp_nopush on;
  open_file_cache max=1000 inactive=60s;
  keepalive_requests 100000000;
  types { text/html html; text/css css; }
  server {
    listen 8081 reuseport backlog=65535;
    root /tmp/site;
  }
}
