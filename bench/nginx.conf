worker_processes 3;
worker_cpu_affinity 001 010 100;
daemon off;
error_log /dev/null crit;
pid /tmp/nginx.pid;
events { worker_connections 65535; use epoll; multi_accept on; }
http {
  access_log off;
  keepalive_requests 100000000;
  server {
    listen 8081 reuseport backlog=65535;
    location / { default_type text/plain; return 200 "Hello, World!"; }
  }
}
